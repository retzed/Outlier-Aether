name: Convert Aether PDFs to Markdown
on:
  push:
    paths:
      - 'Documents.zip'
      - '.github/workflows/convert-aether-pdfs.yml'
permissions:
  contents: write
jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Extract PDFs and convert to Markdown
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          python -m pip install --quiet pymupdf
          mkdir -p /tmp/aether
          unzip -oq Documents.zip -d /tmp/aether
          python - <<'PY'
          import fitz, pathlib, re
          base = pathlib.Path('/tmp/aether')
          for pdf in sorted(base.glob('*.pdf')):
              doc = fitz.open(pdf)
              out = [f'# {pdf.stem}\n', f'> Extracted from `{pdf.name}`. Original PDF: {len(doc)} pages. Page boundaries are retained below.\n']
              for i, page in enumerate(doc, 1):
                  parts = []
                  for b in sorted(page.get_text('blocks'), key=lambda z: (round(z[1], 1), z[0])):
                      t = b[4].strip()
                      if not t or 'CONFIDENTIAL' in t or '@gmail.com' in t or '2026-11-09T04:' in t:
                          continue
                      lines = []
                      for line in t.splitlines():
                          line = line.strip()
                          if not line or 'CONFIDENTIAL' in line or '@gmail.com' in line or re.search(r'2026-11-09T\\d\\d:', line):
                              continue
                          if re.fullmatch(r'[0-9:.TZ-]+', line) or line in {'C', '| zia', 'zia', 'dai'}:
                              continue
                          lines.append(re.sub(r'[ \\t]{2,}', ' ', line))
                      if lines:
                          parts.append('\\n'.join(lines))
                  out += [f'\\n---\\n\\n## Page {i}\\n', '\\n\\n'.join(parts) if parts else '[No extractable text on this page.]', '\\n']
              text = re.sub(r'\\n{3,}', '\\n\\n', '\\n'.join(out)).strip() + '\\n'
              (pathlib.Path('.').joinpath(pdf.stem + '.md')).write_text(text, encoding='utf-8')
          PY
      - name: Commit Markdown files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'Aether FAQ Bank.md' 'Feedback Bank.md' 'Getting Started Slides - Aether Onboarding.md' 'Live S2S ELO.md'
          git commit -m "Add Markdown extractions of Aether PDFs" || echo "No changes to commit"
          git push
